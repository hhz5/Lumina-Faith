    <script>
      // Defensive guard: Ensure window.fetch has both getter and setter across all window/prototype boundaries
      (function() {
        try {
          var target = window;
          var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          if (!desc && typeof Window !== 'undefined' && Window.prototype) {
            desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          }
          if (desc && desc.get && !desc.set) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (_) {}
      })();
    </script>
